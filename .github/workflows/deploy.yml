name: Deploy to Cloudflare Workers

# 目前用本機 wrangler 部署（見 README「部署到 Cloudflare Workers」）。
# 這個 workflow 需要 repo secrets：CLOUDFLARE_API_TOKEN、NEXT_PUBLIC_SUPABASE_URL、NEXT_PUBLIC_SUPABASE_ANON_KEY。
# 還沒設定 CLOUDFLARE_API_TOKEN，所以先改成只能手動觸發，避免每次 push 都失敗。
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
      # lock 檔是用 npm 11 產生的；Node 22 內建的 npm 10 會把 vite 的選用相依（esbuild）當成必要，npm ci 會失敗
      - run: npm install -g npm@11

      - run: npm ci

      - name: Build and deploy
        run: npx opennextjs-cloudflare build && npx opennextjs-cloudflare deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
