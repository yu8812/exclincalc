name: Check Clinical Reference Versions

# 檢查 KDIGO / ADA / ACC-AHA 等指引有沒有新版，結果寫進 reference_pdf_links。
# 需要：repo secrets NEXT_PUBLIC_SUPABASE_URL、SUPABASE_SERVICE_ROLE_KEY，
#       以及正式庫裡的 reference_pdf_links 表（supabase/create_reference_pdf_links.sql，目前還沒建）。
# 條件都還沒備齊，所以先改成手動觸發（原本每月 1 日自動跑，但一直失敗）。
on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
      # lock 檔是用 npm 11 產生的；Node 22 內建的 npm 10 會把 vite 的選用相依（esbuild）當成必要，npm ci 會失敗
      - run: npm install -g npm@11

      - name: Install dependencies
        run: npm ci

      - name: Check clinical guideline versions
        env:
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/check-versions.mjs
